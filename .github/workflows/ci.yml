# Runs on github.com/attrition-tech/arkex; Amp-hosted pushes alone do not run CI.
name: ci

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --log-opts=--all .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux sandbox prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils ruby
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          npx --yes playwright@1.58.2 install-deps chromium
      - run: python -m unittest discover -s scripts -p 'test_release_control.py'
      - run: go build ./...
      - run: go vet ./...
      - name: Tests (race detector)
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=10m -json ./... | tee test-results.jsonl
      - name: Native binary smoke test
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/arkex"
          go build -o "$binary" ./cmd/arkex
          python scripts/smoke.py "$binary" | tee smoke-results.txt
      - name: Sandboxed DNS, Ruby and Playwright
        shell: bash
        run: |
          set -euo pipefail
          ARKEX_SANDBOX_INTEGRATION=1 go test -count=1 -timeout=12m -v ./internal/tools -run '^TestSandboxDeveloperWorkflow$' | tee developer-tools-results.txt
      - name: macOS sandbox diagnostics
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          sudo /usr/bin/log show --last 5m --style compact --predicate 'eventMessage CONTAINS "Sandbox:" OR process == "sandboxd"' > sandbox-denials.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tests-${{ matrix.os }}
          path: |
            test-results.jsonl
            smoke-results.txt
            developer-tools-results.txt
            sandbox-denials.txt
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  licenses:
    name: dependency licenses (MIT/Apache-2.0/BSD/ISC only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/google/go-licenses/v2@latest
      - run: go-licenses check ./... --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target
